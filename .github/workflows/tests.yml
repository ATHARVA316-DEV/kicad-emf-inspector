name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run Pytest
      run: |
        python -m pytest tests/ -v --tb=short
        
    - name: Compile check
      run: |
        python -m py_compile emf_inspector/core/pcb_parser.py
        python -m py_compile emf_inspector/core/field_estimator.py
        python -m py_compile emf_inspector/core/emi_detector.py
        python -m py_compile emf_inspector/core/ai_engine.py
        python -m py_compile emf_inspector/core/report_generator.py
