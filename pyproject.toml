[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "emf-inspector"
version = "1.0.0"
description = "AI-powered electromagnetic interference estimation tool for KiCad PCB layouts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "PCB", "EMI", "electromagnetic", "KiCad",
    "signal-integrity", "RF", "EMC"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "shapely>=2.0",
    "networkx>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
emf-inspector = "emf_inspector.__main__:main"

[project.urls]
Homepage = "https://github.com/your-username/emf-inspector"
Repository = "https://github.com/your-username/emf-inspector"
Issues = "https://github.com/your-username/emf-inspector/issues"
Documentation = "https://github.com/your-username/emf-inspector#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["emf_inspector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]
